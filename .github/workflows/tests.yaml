# Run the test suite on every pull request. The suite is hermetic: it builds throwaway git repos with
# local bare remotes, so it needs no network, no secrets, and no checked-out submodules.
name: tests

on:
  workflow_dispatch: {}
  pull_request:
    branches: [master]

permissions:
  contents: read
  checks: write # publish the test report as a check run on the run summary page

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Git Sandbox Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        # https://github.com/actions/checkout/tree/v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        # https://github.com/astral-sh/setup-uv/tree/v10.3.0
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.14"

      - name: Run the test suite
        run: uv run --no-project --with-requirements ci-requirements.txt pytest -q -m "not integration" --junitxml=tests/reports/test-results.xml

      - name: Publish the test report
        # https://github.com/EnricoMi/publish-unit-test-result-action/tree/v2.25.0
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d
        if: always()
        with:
          files: tests/reports/test-results.xml
          comment_mode: "off"
